<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --page-bg: linear-gradient(135deg, #f5f6fa 0%, #e9ebf1 100%);
    --panel-bg: #fff;
    --border: #e3e6ec;
    --border-light: #eef0f4;
    --text: #333;
    --text-strong: #1f2328;
    --text-sub: #6b7280;
    --text-muted: #9aa1ad;
    --accent: #1677ff;
    --accent-bg: #e6f4ff;
    --shadow: 0 2px 12px rgba(15, 23, 42, .06);
    --radius: 10px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  /* ---------- 顶部标题 ---------- */
  .app-header { flex: none; padding: 18px 24px 12px; }
  .app-title { font-size: 19px; font-weight: 600; color: var(--text-strong); display: flex; align-items: center; gap: 10px; }
  .app-logo {
    flex: 0 0 auto; width: 1.35em; height: 1.35em; display: block;
    border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, .14);
  }
  .app-badge {
    font-size: 12px; font-weight: 400; color: var(--accent);
    background: var(--accent-bg); border-radius: 999px; padding: 2px 10px;
  }
  .app-subtitle { margin-top: 6px; font-size: 12.5px; color: var(--text-muted); }

  /* ---------- 主体布局 ---------- */
  .app-main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 304px minmax(0, 1fr);
    gap: 16px; padding: 0 24px 20px;
  }

  /* ---------- 版本列表 ---------- */
  .version-panel {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .panel-head { flex: none; padding: 12px; border-bottom: 1px solid var(--border-light); }
  .search-input {
    width: 100%; padding: 8px 10px; font-size: 13px; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
    background: #fafbfc; transition: border-color .15s, box-shadow .15s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22, 119, 255, .12); background: #fff; }

  .version-list { flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 8px; }
  .version-item {
    padding: 10px; border-radius: 8px; border: 1px solid transparent;
    margin-bottom: 6px; transition: background .15s, border-color .15s;
  }
  .version-item:hover { background: #f7f8fa; }
  .version-item.active { background: var(--accent-bg); border-color: rgba(22, 119, 255, .28); }
  .version-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .version-name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .version-date { font-size: 11.5px; color: var(--text-muted); }
  .version-highlights { margin-top: 5px; font-size: 12px; line-height: 1.55; color: var(--text-sub); }
  .version-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .file-chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--text-sub);
    transition: all .15s; font-family: inherit;
  }
  .file-chip:hover { border-color: var(--accent); color: var(--accent); }
  .file-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .file-chip.is-missing { opacity: .5; cursor: not-allowed; border-style: dashed; }
  .panel-foot {
    flex: none; padding: 9px 12px; border-top: 1px solid var(--border-light);
    font-size: 11.5px; color: var(--text-muted); line-height: 1.6;
  }
  .empty-tip { padding: 24px 12px; text-align: center; font-size: 12.5px; color: var(--text-muted); }

  /* ---------- 预览区 ---------- */
  .preview-panel {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;

  .toolbar {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border-light); flex-wrap: wrap;
  }
  .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; }
  .tool-btn {
    font-family: inherit; font-size: 12.5px; color: var(--text-sub);
    background: #fff; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 11px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tool-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tool-btn:disabled { opacity: .45; cursor: not-allowed; }
  .tool-btn.is-on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .current-name { font-size: 13px; font-weight: 600; color: var(--text-strong); margin-left: 4px; }

  .variant-switch {
    display: flex; padding: 2px; gap: 2px;
    background: #f1f3f7; border-radius: 8px;
  }
  .variant-btn {
    font-family: inherit; font-size: 12px; color: var(--text-sub);
    background: transparent; border: none; border-radius: 6px;
    padding: 5px 10px; cursor: pointer; transition: all .15s;
  }
  .variant-btn.active { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(15, 23, 42, .1); }

  .frame-wrap { position: relative; flex: 1; min-height: 0; background: #f7f8fa; }
  .preview-frame { width: 100%; height: 100%; border: none; background: #fff; display: block; }

  .loading-mask {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(247, 248, 250, .94); z-index: 2;
  }
  .loading-mask.is-visible { display: flex; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(22, 119, 255, .18); border-top-color: var(--accent);
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12.5px; color: var(--text-sub); text-align: center; line-height: 1.7; }
  .loading-hint { font-size: 11.5px; color: var(--text-muted); }

  .info-bar {
    flex: none; padding: 9px 12px; border-top: 1px solid var(--border-light);
    font-size: 11.5px; color: var(--text-sub); display: flex; gap: 14px; flex-wrap: wrap;

  .info-label { color: var(--text-muted); }
  .info-path { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text-sub); }

    body { overflow: auto; height: auto; min-height: 100vh; }
    .app-main { grid-template-columns: 1fr; padding: 0 14px 16px; }
    .version-panel { max-height: 42vh; }
    .preview-panel { height: 70vh; }
    .app-header { padding: 14px 14px 10px; }

/* ---------- 工具函数 ---------- */
function formatSize(bytes) {
  if (!Number.isFinite(bytes)) return '—';
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
  return Math.round(bytes / 1024) + 'KB';
}

// 中文文件名与括号统一编码，兼容 file:// 与 http:// 两种打开方式
function fileUrl(file) {
  return encodeURI(file.path);
}

function entryOf(i) { return VERSIONS[i]; }

function fileOf(i, variant) {
  const v = entryOf(i);
  return v.files[variant] || v.files.base;
}

function matchedEntries() {
  const kw = state.keyword.trim().toLowerCase();
  return VERSIONS
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => {
      if (!kw) return true;
      const text = (v.version + ' ' + v.date + ' ' + v.highlights).toLowerCase();
      return text.indexOf(kw) !== -1;
    });
}

/* ---------- 渲染版本列表 ---------- */

    const li = document.createElement('li');
    li.className = 'empty-tip';
    li.textContent = '没有匹配的版本';
    listEl.appendChild(li);
    return;
  }

  rows.forEach(({ v, i }) => {
    const li = document.createElement('li');
    li.className = 'version-item' + (i === state.index ? ' active' : '');
    li.dataset.index = String(i);

    const head = document.createElement('div');
    head.className = 'version-head';
    const name = document.createElement('span');
    name.className = 'version-name';
    name.textContent = v.version;
    const date = document.createElement('span');
    date.className = 'version-date';
    date.textContent = v.date;
    head.appendChild(name);
    head.appendChild(date);

    const hl = document.createElement('p');
    hl.className = 'version-highlights';
    hl.textContent = v.highlights || '';

    const files = document.createElement('div');
    files.className = 'version-files';
    Object.keys(VARIANT_LABELS).forEach(variant => {
      const f = v.files[variant];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'file-chip' + (i === state.index && variant === state.variant ? ' active' : '');
      btn.dataset.index = String(i);
      btn.dataset.variant = variant;
      btn.textContent = f
        ? VARIANT_LABELS[variant] + ' · ' + formatSize(f.size)
        : VARIANT_LABELS[variant] + ' · 无';
      if (!f) { btn.disabled = true; btn.classList.add('is-missing'); }
      files.appendChild(btn);
    });

    li.appendChild(head);
    li.appendChild(hl);
    li.appendChild(files);
    listEl.appendChild(li);
  });

  footEl.textContent = '共 ' + VERSIONS.length + ' 个版本 · ' + rows.length + ' 条匹配';

  const active = listEl.querySelector('.version-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

/* ---------- 渲染信息栏 ---------- */
function renderInfo() {
  const v = entryOf(state.index);
  const f = fileOf(state.index, state.variant);
  currentNameEl.textContent = v.version + ' · ' + VARIANT_LABELS[state.variant];

  infoBarEl.innerHTML = '';
  const items = [
    ['日期', v.date],
    ['文件', f ? formatSize(f.size) : '缺失'],
    ['路径', f ? f.path : '—', 'path'],
  ];
  items.forEach(([label, value, kind]) => {
    const span = document.createElement('span');
    span.className = 'info-item';
    const lab = document.createElement('span');
    lab.className = 'info-label';
    lab.textContent = label;
    const val = document.createElement('span');
    val.className = kind === 'path' ? 'info-path' : '';
    val.textContent = value;
    span.appendChild(lab);
    span.appendChild(val);
    infoBarEl.appendChild(span);
  });

  btnOlder.disabled = state.index >= VERSIONS.length - 1;
  btnNewer.disabled = state.index <= 0;

  variantBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.variant === state.variant);
    const target = v.files[btn.dataset.variant];
    btn.disabled = !target;
  });
}

/* ---------- 加载预览 ---------- */
function loadPreview(reason) {
  const v = entryOf(state.index);
  const f = fileOf(state.index, state.variant);
  if (!f) return;

  maskTextEl.textContent = '正在加载 ' + v.version + ' · ' + VARIANT_LABELS[state.variant];
  maskHintEl.textContent = f.size > 5 * 1024 * 1024
    ? '文件较大（' + formatSize(f.size) + '），首次加载可能需要数秒'
    : '';
  maskEl.classList.add('is-visible');

  // 先清空再赋值，确保「刷新」也能真正重新加载
  frameEl.src = 'about:blank';
  setTimeout(() => {
    frameEl.src = fileUrl(f) + (reason === 'reload' ? '?t=' + Date.now() : '');
  }, 40);
}

frameEl.addEventListener('load', () => {
  if (!frameEl.src || frameEl.src === 'about:blank') return;
  maskEl.classList.remove('is-visible');
});

/* ---------- 选择与遍历 ---------- */
function select(index, variant, options) {
  if (index < 0 || index >= VERSIONS.length) return;
  const opts = options || {};
  const prevIndex = state.index;
  const prevVariant = state.variant;

  if (opts.keepVariant !== true) {
    state.variant = variant && entryOf(index).files[variant] ? variant : 'base';
  } else if (!entryOf(index).files[state.variant]) {
    state.variant = 'base';
  }

  state.index = index;
  renderList();
  renderInfo();

  if (prevIndex !== state.index || prevVariant !== state.variant || opts.force) {
    loadPreview(opts.reason);
  }
  if (state.auto) restartAuto();
}

function step(delta) {
  const next = state.index + delta;
  if (next < 0 || next >= VERSIONS.length) return;
  select(next, state.variant, { keepVariant: true });
}

/* ---------- 自动遍历 ---------- */
function startAuto() {
  state.auto = true;
  btnAuto.classList.add('is-on');
  btnAuto.textContent = '自动遍历中';
  restartAuto();
  if (state.index >= VERSIONS.length - 1) select(0, state.variant, { keepVariant: true });
}

function stopAuto() {
  state.auto = false;
  btnAuto.classList.remove('is-on');
  btnAuto.textContent = '自动遍历';
  if (state.autoTimer) {
    clearInterval(state.autoTimer);
    state.autoTimer = null;
  }
}

function restartAuto() {
  if (state.autoTimer) clearInterval(state.autoTimer);
  state.autoTimer = setInterval(() => {
    const next = state.index + 1;
    select(next >= VERSIONS.length ? 0 : next, state.variant, { keepVariant: true });
  }, AUTO_INTERVAL);
}

function toggleAuto() {
  if (state.auto) stopAuto();
  else startAuto();
}

/* ---------- 事件绑定 ---------- */
listEl.addEventListener('click', e => {
  const chip = e.target.closest('.file-chip');
  if (chip && !chip.disabled) {
    select(Number(chip.dataset.index), chip.dataset.variant);
    return;
  }
  const item = e.target.closest('.version-item');
  if (!item) return;
  select(Number(item.dataset.index), state.variant, { keepVariant: true });
});

searchEl.addEventListener('input', () => {
  state.keyword = searchEl.value;
  renderList();
});

btnOlder.addEventListener('click', () => step(1));
btnNewer.addEventListener('click', () => step(-1));
btnAuto.addEventListener('click', toggleAuto);
btnReload.addEventListener('click', () => loadPreview('reload'));
btnOpen.addEventListener('click', () => {
  const f = fileOf(state.index, state.variant);
  if (f) window.open(fileUrl(f), '_blank');
});

variantBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    select(state.index, btn.dataset.variant, { force: true });
  });
});

/* ---------- 初始化 ---------- */
renderList();
renderInfo();
loadPreview();
</script>
</body>
</html>
